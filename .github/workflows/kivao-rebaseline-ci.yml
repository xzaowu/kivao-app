name: KIVAO rebaseline candidate

on:
  push:
    branches: [dev/kivao-upstream-sync-20261117]

permissions:
  contents: read

concurrency:
  group: kivao-rebaseline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    if: github.repository == 'xzaowu/kivao-app'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      time: ${{ steps.source.outputs.time }}
      release: ${{ steps.source.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -B scripts/test_kivao_rebaseline_release.py
      - id: source
        run: python3 scripts/kivao-rebaseline-release.py source --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/source.json"

  quality:
    needs: source
    uses: ./.github/workflows/quality.yml

  upgrade:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: kivao_rehearsal_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Rehearse upgrade and restore on synthetic PostgreSQL 17
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/verify-kivao-schema-upgrade.sh "$PG_CONTAINER" "$RUNNER_TEMP/schema-upgrade" 5432
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kivao-schema-upgrade
          path: |
            ${{ runner.temp }}/schema-upgrade/*-verify.json
            ${{ runner.temp }}/schema-upgrade/old-reject.log
          retention-days: 14

  images:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: web
            file: Dockerfile
          - role: backend
            file: backend/Dockerfile
          - role: agent
            file: yingce-agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Export only committed sources
        run: |
          mkdir "$RUNNER_TEMP/context"
          git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/context"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/context
          file: ${{ runner.temp }}/context/${{ matrix.file }}
          platforms: linux/amd64
          push: false
          load: true
          tags: kivao-ci-${{ matrix.role }}:${{ github.sha }}
          provenance: false
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ needs.source.outputs.version }}
            BUILD_TIME=${{ needs.source.outputs.time }}
          labels: |
            org.opencontainers.image.source=https://github.com/xzaowu/kivao-app
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.source.outputs.version }}
            io.kivao.release=${{ needs.source.outputs.release }}
          cache-from: type=gha,scope=kivao-rebaseline-${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=kivao-rebaseline-${{ matrix.role }}
      - name: Verify actual image identity without application startup
        env:
          ROLE: ${{ matrix.role }}
        run: |
          python3 scripts/kivao-rebaseline-release.py verify-image --sha "$GITHUB_SHA" \
            --role "$ROLE" --image "kivao-ci-$ROLE:$GITHUB_SHA" --output "$RUNNER_TEMP/image-$ROLE.json"
      - uses: actions/upload-artifact@v4
        with:
          name: kivao-rebaseline-image-${{ matrix.role }}
          path: ${{ runner.temp }}/image-${{ matrix.role }}.json
          retention-days: 30

  report:
    needs: [source, quality, upgrade, images]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require all candidate jobs
        env:
          SOURCE: ${{ needs.source.result }}
          QUALITY: ${{ needs.quality.result }}
          UPGRADE: ${{ needs.upgrade.result }}
          IMAGES: ${{ needs.images.result }}
        run: test "$SOURCE/$QUALITY/$UPGRADE/$IMAGES" = success/success/success/success
      - uses: actions/download-artifact@v4
        with:
          pattern: kivao-rebaseline-image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Produce machine-readable candidate evidence
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UPGRADE_RESULT: ${{ needs.upgrade.result }}
        run: |
          python3 scripts/kivao-rebaseline-release.py summary --sha "$GITHUB_SHA" \
            --directory "$RUNNER_TEMP/images" --output "$RUNNER_TEMP/ci-report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: kivao-rebaseline-ci-report
          path: ${{ runner.temp }}/ci-report.json
          retention-days: 30
